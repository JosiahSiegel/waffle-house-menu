name: Sync Waffle House nutritionals

on:
  schedule:
    - cron: "17 9 * * 1"   # Mondays 09:17 UTC (odd minute to dodge cron rush)
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/sync.yml"

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch and parse latest nutritionals
        id: sync
        run: |
          set -o pipefail
          python scripts/sync.py | tee sync_out.txt
          echo "result=$(tail -n1 sync_out.txt)" >> "$GITHUB_OUTPUT"
          python -c "import json; print('source_updated=' + str(json.load(open('data/meta.json'))['source_updated']))" >> "$GITHUB_OUTPUT"

      - name: Regression test (allergen anchor filter)
        # If a future change to index.html's filter logic or the
        # data shape breaks the Waffles-with-Wheat case the user
        # filed, this catches it before the broken page can ship
        # via the weekly sync. Pure stdlib + the parsed data, so
        # no extra dependencies to install.
        run: |
          if [ -f data/menu.json ]; then
            python scripts/test-allergen-anchor.py
          else
            echo "::warning::data/menu.json not present; skipping filter test."
          fi

      - name: Create or update data pull request
        id: data-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          base: main
          branch: automation/sync-nutritionals
          add-paths: data/
          commit-message: "chore: sync nutritionals (source updated ${{ steps.sync.outputs.source_updated }})"
          title: "chore: sync nutritionals (source updated ${{ steps.sync.outputs.source_updated }})"
          body: |
            Updates the menu data from the latest official nutritionals PDF.
            Merge after the required Tests checks pass.

      - name: Run required checks on the data branch
        if: steps.data-pr.outputs.pull-request-number
        # GITHUB_TOKEN-created PRs and pushes do not trigger other workflows.
        # workflow_dispatch does, and records checks against the branch's HEAD.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run test.yml --ref automation/sync-nutritionals
